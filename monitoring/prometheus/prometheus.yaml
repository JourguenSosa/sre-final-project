apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager:9093"

    rule_files:
      - "/etc/prometheus-rules/alerts.yml"


    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: "sre-final-app"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "sre-final-app:5000"
