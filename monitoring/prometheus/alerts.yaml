apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules

data:
  alerts.yml: |
    groups:
      - name: sre-final-project
        rules:
          - alert: SREApplicationErrors
            expr: sre_http_errors_total > 0
            for: 10s
            labels:
              severity: warning
            annotations:
              summary: "Errors detected in SRE Final Application"
              description: "The application has reported HTTP errors."
