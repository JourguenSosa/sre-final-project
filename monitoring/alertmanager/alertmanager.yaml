apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config

data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: "default-receiver"
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1m

    receivers:
      - name: "default-receiver"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest

          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"

          ports:
            - containerPort: 9093

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager

          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager

spec:
  selector:
    app: alertmanager

  ports:
    - name: http
      port: 9093
      targetPort: 9093
