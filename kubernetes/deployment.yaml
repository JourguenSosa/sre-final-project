apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-final-app
  labels:
    app: sre-final-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-final-app

  template:
    metadata:
      labels:
        app: sre-final-app

    spec:
      containers:
        - name: sre-final-app
          image: sre-final-app:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
